name: Extract ASN Prefixes

on:
  workflow_dispatch:  # 手動觸發工作流程

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'  # 使用你需要的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyasn

    - name: Download BGP data & Run Python script
      run: python asn-prefix-extractor.py 45102

    - name: Download BGP data & Run Python script & export sqlite
      run: python build_bgp_sqlite.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        find . -name '*.txt' -exec git add {} +
        find . -name '*.sqlite' -exec git add {} +
        if git diff --cached --quiet; then
          echo "No changes, skip commit."
        else
          git commit -m 'Add asn_{asn}_prefixes.txt'
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
