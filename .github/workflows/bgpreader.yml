name: Extract BGP Prefixes

on:
  schedule:
    - cron: '0 0 * * *'  # 每天運行一次
  workflow_dispatch:    # 手動觸發

jobs:
  extract-prefixes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install bgpstream
      run: |
        sudo apt-get install build-essential curl zlib1g-dev libbz2-dev libcurl4-openssl-dev librdkafka-dev
        mkdir ~/src
        cd ~/src/
        curl -LO https://github.com/LibtraceTeam/wandio/archive/refs/tags/4.2.4-1.tar.gz
        tar zxf wandio-4.2.3.tar.gz
        cd wandio-4.2.3/
        ./configure
        make
        sudo make install
        sudo ldconfig

    - name: Extract prefixes for ASN 9505
      run: |
        bgpreader -c rrc00 -w $(date +%s) -j 9505 > prefixes.txt

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add prefixes.txt
        git commit -m "Update prefixes for ASN 9505"
        git push
