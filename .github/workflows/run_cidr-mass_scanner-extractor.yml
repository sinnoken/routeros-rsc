name: CIDR Aggregator
on:
  schedule:
    - cron: '0 0 * * 1' # 每週一凌晨 0 點執行
  workflow_dispatch:      # 允許手動點擊執行

jobs:
  aggregate-cidr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Aggregate CIDR
        run: |
          # 1. 下載並清理 (保留 IPv4 與 IPv6)
          echo "正在下載並清理 Maltrail 清單..."
          curl -s -f https://raw.githubusercontent.com/stamparm/maltrail/master/trails/static/mass_scanner.txt | \
          sed 's/#.*$//' | awk '{$1=$1;print}' | grep -v '^$' | sort -u > raw_ips.txt
          
          if [ ! -s raw_ips.txt ]; then
            echo "錯誤：檔案為空。"
            exit 1
          fi

          # 2. Python 分流處理
          echo "開始進行 CIDR 聚合計算 (IPv4 & IPv6)..."
          python3 -c "
          import ipaddress
          import sys

          ipv4_list = []
          ipv6_list = []

          try:
              with open('raw_ips.txt', 'r') as f:
                  for line in f:
                      ip_str = line.strip()
                      if not ip_str: continue
                      try:
                          net = ipaddress.ip_network(ip_str, strict=False)
                          if net.version == 4:
                              ipv4_list.append(net)
                          elif net.version == 6:
                              ipv6_list.append(net)
                      except ValueError:
                          continue

              # 分別排序與聚合
              ipv4_list.sort()
              ipv6_list.sort()
              
              ipv4_collapsed = ipaddress.collapse_addresses(ipv4_list)
              ipv6_collapsed = ipaddress.collapse_addresses(ipv6_list)

              # 寫入 IPv4 檔案
              with open('mass_scanner_cidr.txt', 'w') as f:
                  for net in ipv4_collapsed:
                      f.write(str(net) + '\n')
              
              # 寫入 IPv6 檔案
              with open('mass_scanner_cidr_v6.txt', 'w') as f:
                  for net in ipv6_collapsed:
                      f.write(str(net) + '\n')
                      
          except Exception as e:
              print(f'❌ 錯誤: {e}')
              sys.exit(1)
          "

          # 3. 安全性檢查：確保檔案有產生
          echo "✅ 轉換成功！"
          echo "IPv4 網段數：$(wc -l < mass_scanner_cidr.txt)"
          echo "IPv6 網段數：$(wc -l < mass_scanner_cidr_v6.txt)"

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update: Aggregated Maltrail CIDR list (v4 & v6) [skip ci]"
          # 這裡設定要追蹤並提交的檔案模式
          file_pattern: 'mass_scanner_cidr.txt mass_scanner_cidr_v6.txt'
