name: CIDR Aggregator to RouterOS
on:
  schedule:
    - cron: '0 0 * * 1' # 每週一凌晨 0 點執行
  workflow_dispatch:      # 允許手動點擊執行

jobs:
  aggregate-cidr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, Process, and Generate RSC
        run: python3 mass_scanner-extractor.py

      - name: Move RSC files to rsc/ folder
        run: |
          mkdir -p rsc
          mv mass_scanner.rsc rsc/mass_scanner.rsc
          mv mass_scanner_v6.rsc rsc/mass_scanner_v6.rsc

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update: Maltrail Scanner RouterOS RSC list [skip ci]"
          file_pattern: 'rsc/mass_scanner.rsc rsc/mass_scanner_v6.rsc'
