name: CIDR Aggregator
on:
  schedule:
    - cron: '0 0 * * 1' # 每週一凌晨 0 點執行
  workflow_dispatch:      # 允許手動點擊執行

jobs:
  aggregate-cidr:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 確保有寫入倉庫的權限
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Aggregate CIDR
        run: |
          # 1. 下載並強力過濾
          # sed 's/#.*$//' : 移除行內註解 (從 # 開始到結尾)
          # awk '{$1=$1;print}' : 移除行首行尾的空白字元
          # grep -v '^$' : 移除空行
          echo "正在下載並清理 Maltrail 清單..."
          curl -s -f https://raw.githubusercontent.com/stamparm/maltrail/master/trails/static/mass_scanner.txt | \
          sed 's/#.*$//' | awk '{$1=$1;print}' | grep -v '^$' | sort -u > raw_ips.txt
          
          if [ ! -s raw_ips.txt ]; then
            echo "錯誤：檔案為空，可能是來源網址失效。"
            exit 1
          fi

          # 2. Python 聚合處理 (維持不變，內部的 line.strip() 會進一步確保乾淨)
          echo "開始進行 CIDR 聚合計算..."
          python3 -c "
          import ipaddress
          import sys

          valid_ips = []
          try:
              with open('raw_ips.txt', 'r') as f:
                  for line in f:
                      ip_str = line.strip()
                      if not ip_str: continue
                      try:
                          # 這裡會處理掉 74.82.47.2 這種純 IP
                          net = ipaddress.ip_network(ip_str, strict=False)
                          valid_ips.append(net)
                      except ValueError:
                          print(f'⚠️ 警告：忽略無效格式 -> {ip_str}')
              
              valid_ips.sort()
              cidrs = ipaddress.collapse_addresses(valid_ips)

              with open('mass_scanner_cidr.txt', 'w') as f:
                  for net in cidrs:
                      f.write(str(net) + '\n')
          except Exception as e:
              print(f'❌ 錯誤: {e}')
              sys.exit(1)
          "

          # 3. 安全性檢查：確保生成的檔案不是空的
          if [ ! -s mass_scanner_cidr.txt ]; then
            echo "錯誤：產出的 CIDR 清單為空，終止 Commit！"
            exit 1
          fi
          
          echo "✅ 轉換成功！原始 IP 數：$(wc -l < raw_ips.txt)，聚合後網段數：$(wc -l < mass_scanner_cidr.txt)"

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update: Aggregated Maltrail CIDR list [skip ci]"
          file_pattern: 'mass_scanner_cidr.txt'
