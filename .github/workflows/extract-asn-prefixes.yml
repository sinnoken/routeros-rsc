name: Extract ASN Prefixes

on:
  workflow_dispatch:  # 手動觸發工作流程

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'  # 使用你需要的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyasn

    - name: Download BGP data & Run Python script
      run: python extract_asn_prefixes.py 45102

    - name: Check for changes
      id: changes
      run: |
        git diff --exit-code '*.txt' || echo "has_changes=true" >> $GITHUB_ENV

    - name: Commit and push changes
      if: env.has_changes == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add **/*.txt
        git commit -m 'Add asn_{asn}_prefixes.txt'
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
