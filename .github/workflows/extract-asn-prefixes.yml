name: Extract ASN Prefixes

on:
  workflow_dispatch:  # 手動觸發工作流程

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'  # 使用你需要的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyasn

    - name: Download BGP data
      run: |
        wget http://data.caida.org/datasets/routing/routeviews-prefix2as/2023/09/routeviews-rv2-20230901-1200.pfx2as.gz
        gunzip -v routeviews-rv2-20230901-1200.pfx2as.gz

    - name: Run Python script
      run: python extract_asn_prefixes.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add asn9505_prefixes.txt
        git commit -m 'Add ASN 9505 prefixes'
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
