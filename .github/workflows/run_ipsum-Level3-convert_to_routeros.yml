name: Convert stamparm/ipsum list of bad IPs(level3) to RouterOS addressList

on:
  schedule:
  - cron: "0 2 * * *"
  
  workflow_dispatch:
    # ASN 對照：
    #   AS45102 = Alibaba Cloud (阿里雲國際)
    #   AS14061 = DigitalOcean
    # 其他常見雲端/VPS ASN 可參考：
    #   AS16509 / AS14618 = Amazon AWS
    #   AS8075           = Microsoft Azure
    #   AS15169 / AS396982 = Google
    #   AS37963          = Alibaba Cloud 中國
    #   AS132203         = Tencent Cloud
    #   AS20473          = Vultr
    #   AS63949          = Linode / Akamai
    #   AS31898          = Oracle Cloud
    #   AS36351          = IBM Cloud
    inputs:
      custom_asns:
        description: '輸入要查詢的 ASN (以空格分隔)'
        required: false
        default: 'AS45102 AS14061'
env:
  # --- 新增：預設排程執行的 ASN 列表 ---
  DEFAULT_ASNS: "AS45102"
  
jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip' # caching pip dependencies

    - name: Install requests
      run: pip install -r requirements.txt

    - name: Run python ipsum-convert_to_routeros.py
      run: python ./ipsum-convert_to_routeros.py
      continue-on-error: true

    - name: Run python ros-blocklist-gen.py
      run: python ./ros-blocklist-gen.py
      continue-on-error: true
    # --- 新增：執行 ASN 抓取與聚合腳本 ---
    - name: Run python ros-asn-addresslist-gen.py
      run: |
        if [ "${{ github.event.inputs.custom_asns }}" != "" ]; then
          RUN_ASNS="${{ github.event.inputs.custom_asns }}"
        else
          RUN_ASNS="${{ env.DEFAULT_ASNS }}"
        fi
        echo "即將處理以下 ASN: $RUN_ASNS"
        python ./ros-asn-addresslist-gen.py $RUN_ASNS
      continue-on-error: true
    # -----------------------------------
    - name: Generate tag name
      run: echo "TAG_NAME=$(date +%F-%H-%M)" >> $GITHUB_ENV

    - name: Commit & Push changes
      uses: actions-js/push@v1.6
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    # 排程觸發時 github.event.commits 為空，改由 git 取得實際推送的 commit
    - name: Get pushed commit
      id: pushed
      run: |
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

    - name: Notify the commit on Telegram
      uses: appleboy/telegram-action@v1.1.1
      with:
        token: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
        to: '${{ secrets.TELEGRAM_CHAT_ID }}'
        message: |
          ${{ github.actor }} created commit:
          Commit message: ${{ steps.pushed.outputs.message }}

          Repository: ${{ github.repository }}

          See changes: https://github.com/${{ github.repository }}/commit/${{ steps.pushed.outputs.sha }}

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./rsc/*.rsc
        name: Automatic list generation
        tag_name: ${{ env.TAG_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Delete older releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 2
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#    - name: Upload log files
