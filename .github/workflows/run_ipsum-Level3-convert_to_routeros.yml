name: Convert stamparm/ipsum list of bad IPs(level3) to RouterOS addressList

on:
  schedule:
  - cron: "0 2 * * *"
  
  workflow_dispatch:
    # --- 新增：允許手動輸入 ASN ---
    inputs:
      custom_asns:
        description: '輸入要查詢的 ASN (以空格分隔)'
        required: false
        default: 'AS45102'
env:
  # --- 新增：預設排程執行的 ASN 列表 ---
  DEFAULT_ASNS: "AS45102"
  
jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - uses: browser-actions/setup-chrome@v1
      id: setup-chrome
      with:
        install-chromedriver: true
    - run: ${{ steps.setup-chrome.outputs.chrome-path }} --version
      
    - name: Set up Python
      uses: actions/setup-python@main
      with:
        python-version: '3.x'
        cache: 'pip' # caching pip dependencies
        
    - name: Install requests
      run: pip install -r requirements.txt

    - name: Run python ipsum.py
      run: python ./ipsum-Level3-convert_to_routeros.py
    - name: Run python selenium_test.py
      run: python ./selenium_test.py
      continue-on-error: true
      env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          
    - name: Run python ros-blocklist-gen.py
      run: python ./ros-blocklist-gen.py
      continue-on-error: true
    # --- 新增：執行 ASN 抓取與聚合腳本 ---
    - name: Run python ros-asn-addresslist-gen.py
      run: |
        if [ "${{ github.event.inputs.custom_asns }}" != "" ]; then
          RUN_ASNS="${{ github.event.inputs.custom_asns }}"
        else
          RUN_ASNS="${{ env.DEFAULT_ASNS }}"
        fi
        echo "即將處理以下 ASN: $RUN_ASNS"
        python ./ros-asn-addresslist-gen.py $RUN_ASNS
      continue-on-error: true
    # -----------------------------------
    - name: Generate tag name
      run: echo "TAG_NAME=$(date +%F-%H-%M)" >> $GITHUB_ENV

    - name: Commit & Push changes
      uses: actions-js/push@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        force: true

    - name: Notify the commit on Telegram
      uses: appleboy/telegram-action@master
      with:
        token: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
        to: '${{ secrets.TELEGRAM_CHAT_ID }}'
        message: |
          ${{ github.actor }} created commit:
          Commit message: ${{ github.event.commits[0].message }}
          
          Repository: ${{ github.repository }}
          
          See changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}

    - name: Create Release
      uses: softprops/action-gh-release@master
      with:
        files: ./rsc/*.rsc
        name: Automatic list generation
        tag_name: ${{ env.TAG_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Delete older releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

