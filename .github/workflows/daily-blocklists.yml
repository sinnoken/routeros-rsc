name: "Daily: blocklists (ipsum, ipv64, ET, Spamhaus, ASN)"

on:
  schedule:
  - cron: "0 2 * * *"

  workflow_dispatch:
    # ASN 對照：
    #   AS45102 = Alibaba Cloud (阿里雲國際)
    #   AS14061 = DigitalOcean
    # 其他常見雲端/VPS ASN 可參考：
    #   AS16509 / AS14618 = Amazon AWS
    #   AS8075           = Microsoft Azure
    #   AS15169 / AS396982 = Google
    #   AS37963          = Alibaba Cloud 中國
    #   AS132203         = Tencent Cloud
    #   AS20473          = Vultr
    #   AS63949          = Linode / Akamai
    #   AS31898          = Oracle Cloud
    #   AS36351          = IBM Cloud
    inputs:
      custom_asns:
        description: '輸入要查詢的 ASN (以空格分隔)'
        required: false
        default: 'AS45102 AS14061'
env:
  # 預設排程執行的 ASN 列表
  DEFAULT_ASNS: "AS45102"

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip' # caching pip dependencies

    - name: Install requests
      run: pip install -r requirements.txt

    - name: Generate legacy ipsum lists
      run: python scripts/gen_ipsum_legacy.py
      continue-on-error: true

    - name: Generate blocklists
      run: python scripts/gen_blocklists.py
      continue-on-error: true

    # 手動輸入的 ASN 經由環境變數傳入，避免直接展開到 shell 指令中
    - name: Generate ASN address lists
      env:
        CUSTOM_ASNS: ${{ github.event.inputs.custom_asns }}
      run: |
        RUN_ASNS="${CUSTOM_ASNS:-$DEFAULT_ASNS}"
        echo "即將處理以下 ASN: $RUN_ASNS"
        python scripts/gen_asn_addresslist.py $RUN_ASNS
      continue-on-error: true

    # 以 step output 傳遞，編輯器的靜態檢查才認得到（$GITHUB_ENV 會被標為可能無效）
    - name: Generate tag name
      id: tag
      run: |
        echo "name=$(date +%F-%H-%M)" >> $GITHUB_OUTPUT
        echo "date=$(date -u +%F)" >> $GITHUB_OUTPUT

    - name: Commit & Push changes
      uses: actions-js/push@v1.6
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        message: "chore(lists): update daily blocklists (${{ steps.tag.outputs.date }})"

    # 排程觸發時 github.event.commits 為空，改由 git 取得實際推送的 commit
    - name: Get pushed commit
      id: pushed
      run: |
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

    - name: Notify the commit on Telegram
      uses: appleboy/telegram-action@v1.1.1
      with:
        token: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
        to: '${{ secrets.TELEGRAM_CHAT_ID }}'
        message: |
          ${{ github.actor }} created commit:
          Commit message: ${{ steps.pushed.outputs.message }}

          Repository: ${{ github.repository }}

          See changes: https://github.com/${{ github.repository }}/commit/${{ steps.pushed.outputs.sha }}

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./rsc/*.rsc
        name: Automatic list generation
        tag_name: ${{ steps.tag.outputs.name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # dev-drprasad/delete-older-releases 仍是 node20 且已無更新，改用 runner 內建的 gh CLI
    # 保留最新 2 個 release，其餘連同 tag 一併刪除
    - name: Delete older releases
      run: |
        gh release list --limit 1000 --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[2:][] | .tagName' |
        while read -r tag; do
          gh release delete "$tag" --cleanup-tag --yes
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
